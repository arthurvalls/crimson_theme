# vim:ft=kitty
## name:     Gumshoe
## blurb:    Film-noir monochrome. Silver-gelatin greys (#cfcfd4) on inky, slightly
##           cool black (#0a0a0d), one amber accent (whisky / cigarette glow) and
##           one oxblood splash reserved for errors and deletes. Matches
##           gumshoe.nvim (lua/gumshoe/palette.lua). terminal-sync.lua resolves
##           this file by the colorscheme name (`gumshoe` -> gumshoe.conf).

foreground               #cfcfd4
background               #0a0a0d
selection_foreground     #cfcfd4
selection_background     #26262e
cursor                   #d4a050
cursor_text_color        #0a0a0d
url_color                #9a7438

active_border_color      #9a7438
inactive_border_color    #22222a

# ANSI. gumshoe.nvim ships no terminal_color_* table, so the 16 slots are mapped
# from the palette by role, not by hue:
#   0/8   inky black, then fg_muted for dim text and comments
#   1/9   oxblood — errors and destructive git ops (9 is oxblood lifted)
#   2/10  the "add" slot: amber_dim, matching GitSignsAdd
#   3/11  amber and amber_bright — strings, warnings, changed files
#   4/12  cool grey — the palette has no blue, so directories read as silver
#   5/13  mauve-tinted grey — a trace of the femme fatale, not a real magenta
#   6/14  cool teal-grey
#   7/15  the silver-gelatin foreground scale: fg_dim, then fg
color0   #13131a
color8   #71717a
color1   #a64545
color9   #c25a5a
color2   #9a7438
color10  #b98d48
color3   #d4a050
color11  #e8b86a
color4   #6a6a7a
color12  #9a9aae
color5   #7a6a74
color13  #a8949e
color6   #6b7a7c
color14  #9aacae
color7   #a3a3aa
color15  #cfcfd4

active_tab_foreground    #0a0a0d
active_tab_background    #e8b86a
inactive_tab_foreground  #71717a
inactive_tab_background  #070709

# Noir wants an empty frame: no wallpaper, fully opaque, so the amber accent is
# the only light in the room. `background_image none` clears any image left by a
# previous theme conf (gruvbox-ish, yorha). These lines apply on kitty start
# only — `kitty @ load-config` and nvim's live `kitty @ set-colors` swap the
# palette but never the background image or opacity.
background_opacity 1.0
dynamic_background_opacity yes
background_image none
